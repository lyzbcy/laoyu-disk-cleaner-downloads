name: Windows candidate ordinary-token experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restricted-probe:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Verify generic bootstrap contracts
        run: node --test test/candidate-bootstrap.test.cjs
      - name: Download SHA-pinned draft candidate using this repository token
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/candidate-bootstrap.cjs download laoyu-disk-cleaner-2.0.0-win-x64.zip downloads
      - name: Extract actual original candidate and stage unchanged production modules
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath downloads/laoyu-disk-cleaner-2.0.0-win-x64.zip -DestinationPath candidate -ErrorAction Stop
          node scripts/candidate-bootstrap.cjs copy candidate/resources/app $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile native declarations and verify single-variable probe contracts
        run: node --test test/restricted-probe.test.cjs
      - name: Experiment on a new same-SID restricted token only
        shell: pwsh
        run: |
          $nodePath = (Get-Command node -CommandType Application).Source
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/cleaner-restricted-probe.ps1 -NodeExe $nodePath -ProjectRoot $env:GITHUB_WORKSPACE -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'verification/restricted-probe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleaner-public-restricted-token-evidence
          path: |
            verification/production-copy-proof.json
            verification/restricted-probe/
          if-no-files-found: error
